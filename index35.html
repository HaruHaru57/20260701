<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 60 - ミニダッシュボード</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    /* ダークモード用の変数定義 */
    body.dark-theme {
      --bg-color: #1e1e1e;
      --card-bg: #2d2d2d;
      --text-color: #f0f0f0;
    }

    body {
      font-family: sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
      transition: background-color 0.3s, color 0.3s;
    }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .card { background: var(--card-bg); padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
    textarea { width: 100%; height: 80px; box-sizing: border-box; margin-top: 10px; padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
    button { padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px; background: #007bff; color: white; }
    
    /* モーダル */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; }
    .modal-content { background: var(--card-bg); padding: 20px; border-radius: 8px; text-align: center; color: var(--text-color); }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Day 60 Dashboard</h1>
    <button id="theme-toggle">🌙 テーマ切替</button>
  </div>

  <!-- メモ機能カード -->
  <div class="card">
    <h3>クイックメモ（自動保存）</h3>
    <textarea id="memo-input" placeholder="ここに書いた内容は自動保存されます..."></textarea>
    <p id="save-status" style="font-size: 0.8rem; color: #888;"></p>
  </div>

  <!-- アクションカード -->
  <div class="card">
    <h3>クイックアクション</h3>
    <button id="open-info-btn">お知らせを見る</button>
  </div>

  <!-- モーダル -->
  <div id="info-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h2>🎉 Day 60 達成！</h2>
      <p>JavaScriptの基本UI実装編をすべて完了しました！</p>
      <button id="close-info-btn">閉じろ</button>
    </div>
  </div>

  <script type="module" src="script9.js"></script>
</body>

</html>
